<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bus Stop Information</title>
  <link rel="icon" type="image/png" href="./img/stop-button.png">
  <link rel="stylesheet" href="./style.css">
  <!-- Include Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <!-- Include jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <!-- Include Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <!-- Your main script -->
  <script src="./script.js"></script>
</head>
<body>
  <h2>Bus Stop Information</h2>
  <a href="./index.html" style="display:inline-block; margin: 8px 0 4px; color:#007bff; font-size:0.95em;">&larr; Back to Home</a>
  <!-- Hidden input to hold the stop ID -->
  <input type="hidden" id="stopIdInput">
  <div id="updateStatus"></div>
  <br>
  <table id="busTable">
    <thead>
      <tr>
        <th colspan="4" id="stopInfoHeader"></th>
      </tr>
      <tr>
        <th><img src="./img/bus.png" alt="Bus Line" class="icon"></th>
        <th><img src="./img/clock.png" alt="Arrival Time" class="icon"></th>
        <th><img src="./img/destination.png" alt="Destination" class="icon"></th>
        <th><img src="./img/map.png" alt="Location" class="icon"></th>
      </tr>
    </thead>
    <tbody>
      <!-- Data will be inserted here dynamically -->
    </tbody>
  </table>
  <p id="timestamp"></p>
  <button id="shareStopBtn" onclick="shareStopUrl()">Copy link &#x2398;</button>
  <!-- Modal structure for the map -->
  <div id="mapModal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Bus Location</h2>
        <div id="mapContainer"></div>
    </div>
  </div>
  <!-- Custom error dialog -->
  <div id="customDialog" class="modal">
    <div class="modal-content">
        <span class="close-dialog">&times;</span>
        <p id="dialogMessage"></p>
    </div>
  </div>
  <div id="loadingText"></div>
  <script>
    $(document).ready(function() {
      // Parse the stopId from the URL query string
      const urlParams = new URLSearchParams(window.location.search);
      const stopId = urlParams.get('stopId');
      if (stopId) {
        // Set the hidden field value so fetchBusData() can use it
        $('#stopIdInput').val(stopId);
        // Call your API function to display the bus stop information
        fetchBusData();
      } else {
        alert("No stop ID provided in the URL.");
      }
    });

    function shareStopUrl() {
      var url = window.location.href;
      navigator.clipboard.writeText(url).then(function() {
        var btn = document.getElementById('shareStopBtn');
        var original = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(function() { btn.textContent = original; }, 2000);
      }).catch(function() {
        prompt('Copy this link:', url);
      });
    }
  </script>
</body>
</html>
